# Local environment: gateway (nginx) -> api (FastAPI + agent) and web (static files).
#   export GEMINI_API_KEY=...   (or ZHIPUAI_API_KEY with TRIAGE_MODEL=glm-4.7-flashx)
#   docker compose up --build -d   ->  http://localhost:8080
services:
  api:
    build: .
    image: triage-agent-api:0.1.0
    environment:
      TRIAGE_MODEL: ${TRIAGE_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: web
    image: triage-agent-web:0.1.0
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
