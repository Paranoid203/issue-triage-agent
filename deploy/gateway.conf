# Local gateway for docker compose: the same routing as the Kubernetes Ingress.
server {
    listen 8080;

    # Agent turns are Server-Sent Events: no buffering, long reads.
    location /api/threads/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://api:8000;
    }
    location = /readyz {
        proxy_pass http://api:8000;
    }
    location / {
        proxy_pass http://web:8080;
    }
}
