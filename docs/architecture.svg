<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="triage-agent 架构：LangGraph 编排的规划、执行、工具三类节点，本地工具与 MCP 工具，两家模型提供方，以及离线评测流程">
  <title>triage-agent 架构</title>
  <desc>用户的每条消息进入 LangGraph：planner 把消息拆成子任务，executor 调用模型决定工具，ToolNode 执行本地工具和 MCP 工具，所有子任务提交后结束本轮；checkpointer 保存多轮记忆。模型通过 LangChain 接入智谱和 Google 两家。右侧是离线评测流程。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .h { font-size: 15px; font-weight: 600; }
      .s { font-size: 12.5px; fill: #374151; }
      .m { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1f2937; }
      .lbl { font-size: 12px; fill: #374151; }
      .line { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>

  <text x="20" y="28" class="h">运行时：LangGraph 编排，模型自己决定调用哪个工具</text>

  <rect x="20" y="48" width="140" height="84" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="90" y="78" text-anchor="middle" class="h">用户消息</text>
  <text x="90" y="98" text-anchor="middle" class="s">一句多任务</text>
  <text x="90" y="116" text-anchor="middle" class="s">或多轮追问</text>

  <rect x="190" y="44" width="470" height="236" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="206" y="66" class="h">LangGraph StateGraph（graph.py）</text>

  <rect x="206" y="80" width="130" height="58" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="271" y="104" text-anchor="middle" class="m">planner</text>
  <text x="271" y="124" text-anchor="middle" class="s">拆成子任务列表</text>

  <rect x="372" y="80" width="130" height="58" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="437" y="104" text-anchor="middle" class="m">executor</text>
  <text x="437" y="124" text-anchor="middle" class="s">模型返回工具调用</text>

  <rect x="538" y="80" width="106" height="58" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="591" y="104" text-anchor="middle" class="m">tools</text>
  <text x="591" y="124" text-anchor="middle" class="s">ToolNode 执行</text>

  <rect x="372" y="170" width="130" height="50" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="437" y="191" text-anchor="middle" class="m">nudge</text>
  <text x="437" y="209" text-anchor="middle" class="s">提醒提交剩余子任务</text>

  <rect x="538" y="170" width="106" height="50" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="591" y="191" text-anchor="middle" class="m">END</text>
  <text x="591" y="209" text-anchor="middle" class="s">子任务全部提交</text>

  <path d="M160,100 H202" class="line"/>
  <path d="M336,109 H368" class="line"/>
  <path d="M502,100 H534" class="line"/>
  <path d="M534,122 H506" class="line"/>
  <path d="M424,138 V166" class="line"/>
  <path d="M452,166 V142" class="line"/>
  <path d="M600,138 V166" class="line"/>

  <rect x="206" y="236" width="438" height="32" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="425" y="257" text-anchor="middle" class="s">checkpointer：按会话保存全部消息与工具结果，追问时可引用上一轮</text>

  <rect x="690" y="44" width="290" height="120" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="835" y="68" text-anchor="middle" class="h">模型（两家提供方）</text>
  <text x="706" y="92" class="s">智谱（OpenAI 兼容，langchain-openai）</text>
  <text x="706" y="110" class="m">glm-4.7-flashx · glm-4.5-air</text>
  <text x="706" y="134" class="s">Google（langchain-google-genai）</text>
  <text x="706" y="152" class="m">gemini-3.5-flash-lite</text>
  <path d="M686,100 H650" class="line"/>
  <text x="668" y="92" text-anchor="middle" class="lbl">调用</text>

  <rect x="20" y="318" width="290" height="116" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="165" y="342" text-anchor="middle" class="h">本地工具（LangChain tool）</text>
  <text x="36" y="366" class="m">search_docs</text>
  <text x="36" y="384" class="s">BM25 检索 Pydantic 文档 793 个片段</text>
  <text x="36" y="406" class="m">submit_triage</text>
  <text x="36" y="424" class="s">Pydantic 校验：类型 / 重复 issue / 回答</text>

  <rect x="340" y="318" width="320" height="116" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="342" text-anchor="middle" class="h">MCP server（mcp_server.py）</text>
  <text x="356" y="366" class="m">search_issues · get_issue</text>
  <text x="356" y="386" class="s">799 条真实 GitHub issue 快照，stdio 传输</text>
  <text x="356" y="406" class="s">经 langchain-mcp-adapters 转成工具</text>
  <text x="356" y="424" class="s">评测时只露出报告提交前已有的 issue</text>

  <path d="M560,280 L200,314" class="line"/>
  <path d="M600,280 L520,314" class="line"/>

  <line x1="676" y1="190" x2="676" y2="560" stroke="#d1d5db" stroke-width="1"/>
  <text x="694" y="208" class="h">离线评测（evals/）</text>

  <rect x="694" y="222" width="286" height="62" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="837" y="246" text-anchor="middle" class="h">40 条用例 · 50 个目标</text>
  <text x="837" y="268" text-anchor="middle" class="s">单轮 30 · 一句多任务 4 · 多轮追问 6</text>

  <rect x="694" y="306" width="286" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="837" y="330" text-anchor="middle" class="h">3 个变体 × 40 条用例</text>
  <text x="837" y="352" text-anchor="middle" class="s">两家提供方对比 · 有/无检索对比</text>

  <rect x="694" y="390" width="286" height="78" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="837" y="414" text-anchor="middle" class="h">确定性打分（无 LLM 裁判）</text>
  <text x="837" y="436" text-anchor="middle" class="s">任务执行 · 流程闭环 · 答案 · 工具选择</text>
  <text x="837" y="456" text-anchor="middle" class="s">调用合法 · 检索命中 · 任务拆解</text>

  <rect x="694" y="490" width="286" height="62" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="837" y="514" text-anchor="middle" class="h">results/&lt;时间戳&gt;/</text>
  <text x="837" y="536" text-anchor="middle" class="s">轨迹 · 指标 · 结果图表 · 失败模式归类</text>

  <path d="M837,284 V302" class="line"/>
  <path d="M837,368 V386" class="line"/>
  <path d="M837,468 V486" class="line"/>

  <rect x="20" y="470" width="640" height="82" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="36" y="494" class="h">测试（tests/）</text>
  <text x="36" y="518" class="s">单元测试：BM25、子任务解析、打分规则、参数校验、错误分类、用例可复现</text>
  <text x="36" y="540" class="s">集成测试：脚本化假模型驱动完整 LangGraph 流程，连真实 MCP server，不调付费接口</text>
</svg>
