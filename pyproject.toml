[project]
name = "triage-agent"
version = "0.1.0"
description = "A tool-calling support agent for an open-source project (docs Q&A + GitHub issue triage), with an MCP issue-tracker server and a reproducible eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
triage-agent = "triage_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.ruff]
line-length = 130
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["triage_agent", "evals"]
